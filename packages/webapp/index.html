<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>Choral Forma</title>
    </head>
    <body>
        <script>
            try {
                document.documentElement.dataset.workspaceSidebar =
                    localStorage.getItem("forma.workspaceSidebar") === "collapsed" ? "collapsed" : "expanded";
            } catch {
                document.documentElement.dataset.workspaceSidebar = "expanded";
            }
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
