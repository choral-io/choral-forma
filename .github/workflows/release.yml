name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish when running manually"
        required: true
        type: string
      publish:
        description: "Create or update the GitHub Release after building artifacts"
        required: true
        default: false
        type: boolean
      publish_vscode_marketplace:
        description: "Publish the packaged VSIX to Visual Studio Marketplace"
        required: true
        default: false
        type: boolean
      verify_vscode_marketplace_identity:
        description: "Verify the protected VS Code Marketplace OIDC identity without publishing"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag and artifact versions
        run: node scripts/check-release-version.mjs "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

  verify-vscode-marketplace-identity:
    name: Verify VS Code Marketplace identity
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.verify_vscode_marketplace_identity
    runs-on: ubuntu-24.04
    environment: vscode-marketplace-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Confirm the federated Azure identity
        shell: bash
        run: |
          set -euo pipefail
          echo "OIDC authentication succeeded. Marketplace publication is intentionally not attempted."

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_vscode_marketplace_identity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: forma
            managed_binary: forma-linux-arm64
            archive: tar.gz
          - asset: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: forma
            managed_binary: forma-linux-x64
            archive: tar.gz
          - asset: macos-arm64
            os: macos-26
            target: aarch64-apple-darwin
            binary: forma
            managed_binary: forma-macos-arm64
            archive: tar.gz
          - asset: macos-x64
            os: macos-26-intel
            target: x86_64-apple-darwin
            binary: forma
            managed_binary: forma-macos-x64
            archive: tar.gz
          - asset: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: forma.exe
            managed_binary: forma-windows-x64.exe
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebApp assets
        run: |
          pnpm --filter @choral-forma/shared build
          pnpm --filter @choral-forma/webapp build

      - name: Build forma binary
        run: cargo build --release --locked --bin forma --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          asset="forma-${{ matrix.asset }}"
          package_root="dist-release/package/${asset}"
          source_binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          mkdir -p "${package_root}/bin"
          cp "${source_binary}" "${package_root}/bin/forma"
          chmod +x "${package_root}/bin/forma"
          cp README.md "${package_root}/README.md"
          tar -C dist-release/package -czf "dist-release/${asset}.tar.gz" "${asset}"
          cp "${source_binary}" "dist-release/${{ matrix.managed_binary }}"
          chmod +x "dist-release/${{ matrix.managed_binary }}"
          (
            cd dist-release
            shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
            shasum -a 256 "${{ matrix.managed_binary }}" > "${{ matrix.managed_binary }}.sha256"
          )

      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "forma-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "dist-release/$asset/bin" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist-release/$asset/bin/forma.exe"
          Copy-Item "README.md" "dist-release/$asset/README.md"
          Compress-Archive -Path "dist-release/$asset" -DestinationPath "dist-release/$asset.zip" -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist-release/${{ matrix.managed_binary }}"
          $archiveHash = Get-FileHash -Algorithm SHA256 "dist-release/$asset.zip"
          "$($archiveHash.Hash.ToLower())  $asset.zip" | Set-Content -NoNewline "dist-release/$asset.zip.sha256"
          $binaryHash = Get-FileHash -Algorithm SHA256 "dist-release/${{ matrix.managed_binary }}"
          "$($binaryHash.Hash.ToLower())  ${{ matrix.managed_binary }}" | Set-Content -NoNewline "dist-release/${{ matrix.managed_binary }}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: forma-${{ matrix.asset }}
          path: |
            dist-release/forma-${{ matrix.asset }}.${{ matrix.archive }}
            dist-release/forma-${{ matrix.asset }}.${{ matrix.archive }}.sha256
            dist-release/${{ matrix.managed_binary }}
            dist-release/${{ matrix.managed_binary }}.sha256
          if-no-files-found: error

  extension:
    name: Build VS Code extension
    needs: validate
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_vscode_marketplace_identity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check, lint, test, and build extension
        run: |
          pnpm --filter @choral-forma/shared build
          pnpm --filter forma check
          pnpm --filter forma lint
          pnpm --filter forma test
          pnpm --filter forma build

      - name: Build development Forma binary
        run: |
          pnpm --filter @choral-forma/webapp build
          cargo build --locked --bin forma

      - name: Run Extension Host tests
        run: PATH="${{ github.workspace }}/target/debug:$PATH" xvfb-run -a pnpm --filter forma test:integration

      - name: Inspect package contents
        run: pnpm --filter forma package:contents

      - name: Resolve VSIX output
        shell: bash
        run: |
          version="$(node -p "require('./extensions/vscode/package.json').version")"
          echo "VSIX_NAME=forma-${version}.vsix" >> "$GITHUB_ENV"
          echo "VSIX_OUT=${GITHUB_WORKSPACE}/dist-release/forma-${version}.vsix" >> "$GITHUB_ENV"

      - name: Package and checksum VSIX
        run: |
          pnpm --filter forma package:vsix
          cd dist-release
          shasum -a 256 "$VSIX_NAME" > "$VSIX_NAME.sha256"

      - name: Smoke test packaged VSIX
        env:
          FORMA_TEST_BIN: ${{ github.workspace }}/target/debug/forma
          VSIX_PATH: ${{ env.VSIX_OUT }}
        run: xvfb-run -a pnpm --filter forma smoke:vsix

      - name: Upload extension release artifact
        uses: actions/upload-artifact@v7
        with:
          name: forma-vscode
          path: |
            ${{ env.VSIX_OUT }}
            ${{ env.VSIX_OUT }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, extension]
    runs-on: ubuntu-24.04
    if: (github.event_name == 'push' || inputs.publish) && !inputs.verify_vscode_marketplace_identity
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Download release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --dir release-assets
          mkdir -p upload
          find release-assets -maxdepth 3 -type f -exec cp {} upload/ \;
          ls -la upload

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "${#prerelease_flags[@]}" -gt 0 ]; then
              gh release edit "$RELEASE_TAG" "${prerelease_flags[@]}"
            fi
            gh release upload "$RELEASE_TAG" upload/* --clobber
          else
            gh release create "$RELEASE_TAG" upload/* --generate-notes "${prerelease_flags[@]}"
          fi

  publish-vscode-marketplace:
    name: Publish VS Code Marketplace extension
    needs: [validate, extension]
    if: (github.event_name == 'push' || (inputs.publish && inputs.publish_vscode_marketplace)) && !inputs.verify_vscode_marketplace_identity
    runs-on: ubuntu-24.04
    environment: vscode-marketplace-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packaged VSIX
        uses: actions/download-artifact@v8
        with:
          name: forma-vscode
          path: dist-release

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish packaged VSIX
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./extensions/vscode/package.json').version")"
          vsix_path="dist-release/forma-${version}.vsix"
          test -f "$vsix_path"
          pnpm --filter forma exec vsce publish --packagePath "$vsix_path" --azure-credential
