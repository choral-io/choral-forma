name: Reusable CLI release build

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to build
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  cli:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: forma
            managed_binary: forma-linux-arm64
            archive: tar.gz
            build_image: rust:1.95-bullseye
            glibc_minimum: 2.31
          - asset: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: forma
            managed_binary: forma-linux-x64
            archive: tar.gz
            build_image: rust:1.95-bullseye
            glibc_minimum: 2.31
          - asset: macos-arm64
            os: macos-26
            target: aarch64-apple-darwin
            binary: forma
            managed_binary: forma-macos-arm64
            archive: tar.gz
          - asset: macos-x64
            os: macos-26-intel
            target: x86_64-apple-darwin
            binary: forma
            managed_binary: forma-macos-x64
            archive: tar.gz
          - asset: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: forma.exe
            managed_binary: forma-windows-x64.exe
            archive: zip
    steps:
      - name: Reuse an existing immutable artifact
        id: existing
        shell: bash
        env:
          ARTIFACT_NAME: forma-${{ matrix.asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false) | .id" \
              | head -n 1
          )"
          if [[ -n "${artifact_id}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "Reusing immutable artifact ${ARTIFACT_NAME} (${artifact_id})."
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout exact source
        if: steps.existing.outputs.present != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup pnpm
        if: steps.existing.outputs.present != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.existing.outputs.present != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust target
        if: steps.existing.outputs.present != 'true' && !endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Install dependencies
        if: steps.existing.outputs.present != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build WebApp assets
        if: steps.existing.outputs.present != 'true'
        run: |
          pnpm --filter @choral-forma/shared build
          pnpm --filter @choral-forma/webapp build

      - name: Test self-update contract
        if: steps.existing.outputs.present != 'true' && !endsWith(matrix.target, '-unknown-linux-gnu')
        run: cargo test --release --locked -p forma-cli self_update --target ${{ matrix.target }}

      - name: Test self-update contract in the Linux GNU baseline
        if: steps.existing.outputs.present != 'true' && endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env CARGO_HOME=/tmp/forma-cargo \
            --env RUSTUP_HOME=/usr/local/rustup \
            --env RUSTUP_TOOLCHAIN=1.95.0 \
            --env TARGET="${{ matrix.target }}" \
            "${{ matrix.build_image }}" \
            bash -lc 'cargo test --release --locked -p forma-cli self_update --target "$TARGET"'

      - name: Build Forma CLI
        if: steps.existing.outputs.present != 'true' && !endsWith(matrix.target, '-unknown-linux-gnu')
        run: cargo build --release --locked --bin forma --target ${{ matrix.target }}

      - name: Build Forma CLI in the Linux GNU baseline
        if: steps.existing.outputs.present != 'true' && endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env CARGO_HOME=/tmp/forma-cargo \
            --env RUSTUP_HOME=/usr/local/rustup \
            --env RUSTUP_TOOLCHAIN=1.95.0 \
            --env TARGET="${{ matrix.target }}" \
            "${{ matrix.build_image }}" \
            bash -lc 'cargo build --release --locked --bin forma --target "$TARGET"'

      - name: Verify Linux GNU ABI compatibility
        if: steps.existing.outputs.present != 'true' && endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: node scripts/check-linux-gnu-abi.mjs "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.glibc_minimum }}"

      - name: Execute native CLI
        if: steps.existing.outputs.present != 'true'
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Package Unix artifacts
        if: steps.existing.outputs.present != 'true' && matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          asset="forma-${{ matrix.asset }}"
          package_root="dist-release/package/${asset}"
          source_binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          mkdir -p "${package_root}/bin"
          cp "${source_binary}" "${package_root}/bin/forma"
          chmod +x "${package_root}/bin/forma"
          cp README.md "${package_root}/README.md"
          tar -C dist-release/package -czf "dist-release/${asset}.tar.gz" "${asset}"
          cp "${source_binary}" "dist-release/${{ matrix.managed_binary }}"
          chmod +x "dist-release/${{ matrix.managed_binary }}"
          (
            cd dist-release
            shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
            shasum -a 256 "${{ matrix.managed_binary }}" > "${{ matrix.managed_binary }}.sha256"
          )

      - name: Package Windows artifacts
        if: steps.existing.outputs.present != 'true' && matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "forma-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "dist-release/$asset/bin" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist-release/$asset/bin/forma.exe"
          Copy-Item "README.md" "dist-release/$asset/README.md"
          Compress-Archive -Path "dist-release/$asset" -DestinationPath "dist-release/$asset.zip" -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist-release/${{ matrix.managed_binary }}"
          $archiveHash = Get-FileHash -Algorithm SHA256 "dist-release/$asset.zip"
          "$($archiveHash.Hash.ToLower())  $asset.zip" | Set-Content -NoNewline "dist-release/$asset.zip.sha256"
          $binaryHash = Get-FileHash -Algorithm SHA256 "dist-release/${{ matrix.managed_binary }}"
          "$($binaryHash.Hash.ToLower())  ${{ matrix.managed_binary }}" | Set-Content -NoNewline "dist-release/${{ matrix.managed_binary }}.sha256"

      - name: Smoke test Linux artifacts on supported glibc runtimes
        if: steps.existing.outputs.present != 'true' && endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          for image in debian:11-slim debian:12-slim; do
            docker run --rm \
              --volume "$GITHUB_WORKSPACE/dist-release/${{ matrix.managed_binary }}:/usr/local/bin/forma:ro" \
              "$image" \
              /usr/local/bin/forma --version
          done

      - name: Upload immutable CLI artifact
        if: steps.existing.outputs.present != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: forma-${{ matrix.asset }}
          path: |
            dist-release/forma-${{ matrix.asset }}.${{ matrix.archive }}
            dist-release/forma-${{ matrix.asset }}.${{ matrix.archive }}.sha256
            dist-release/${{ matrix.managed_binary }}
            dist-release/${{ matrix.managed_binary }}.sha256
          if-no-files-found: error
          retention-days: 30
