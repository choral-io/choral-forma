name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge:
    name: Knowledge
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check knowledge Markdown
        run: pnpm exec prettier --check "knowledge/**/*.md"

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check web packages
        run: pnpm check

      - name: Build web packages
        run: pnpm build

  extension:
    name: VS Code Extension
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check aligned release versions
        run: node scripts/check-release-version.mjs

      - name: Check, lint, test, and build extension
        run: |
          pnpm --filter @choral-forma/shared build
          pnpm --filter forma check
          pnpm --filter forma lint
          pnpm --filter forma test
          pnpm --filter forma build

      - name: Build development Forma binary
        run: |
          pnpm --filter @choral-forma/webapp build
          cargo build --locked --bin forma

      - name: Run Extension Host tests
        env:
          FORMA_TEST_BIN: ${{ github.workspace }}/target/debug/forma
        run: PATH="${{ github.workspace }}/target/debug:$PATH" xvfb-run -a pnpm --filter forma test:integration

      - name: Inspect package contents
        run: pnpm --filter forma package:contents

      - name: Resolve VSIX output
        shell: bash
        run: |
          version="$(node -p "require('./packages/vscode-extension/package.json').version")"
          echo "VSIX_OUT=${RUNNER_TEMP}/forma-${version}.vsix" >> "$GITHUB_ENV"

      - name: Package VSIX
        run: pnpm --filter forma package:vsix

      - name: Smoke test packaged VSIX
        env:
          FORMA_TEST_BIN: ${{ github.workspace }}/target/debug/forma
          VSIX_PATH: ${{ env.VSIX_OUT }}
        run: xvfb-run -a pnpm --filter forma smoke:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: forma-vscode
          path: ${{ env.VSIX_OUT }}
          if-no-files-found: error

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build embedded WebApp assets
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Check Zed extension WebAssembly
        run: cargo check -p forma-zed-extension --target wasm32-wasip1 --locked

      - name: Test Rust workspace
        run: cargo test --workspace --locked
