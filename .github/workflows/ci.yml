name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Static site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static WebApp and Forma CLI
        run: |
          pnpm --filter @choral-forma/webapp build
          cargo build --locked --bin forma

      - name: Check FDE example workspaces
        run: pnpm check:examples -- --forma-bin "${GITHUB_WORKSPACE}/target/debug/forma"

      - name: Check workspace and build static artifact
        shell: bash
        run: |
          set -euo pipefail
          forma="${GITHUB_WORKSPACE}/target/debug/forma"
          "${forma}" config inspect --json
          "${forma}" check --json
          "${forma}" workspace health --json
          "${forma}" site build \
            --out dist/site \
            --base-url https://forma.choral.io \
            --json > "${RUNNER_TEMP}/site-build.json"

      - name: Verify static artifact
        shell: bash
        run: |
          set -euo pipefail
          site="${GITHUB_WORKSPACE}/dist/site"
          result="${RUNNER_TEMP}/site-build.json"
          for file in index.html 404.html sitemap.xml robots.txt _headers .forma-site-artifact data/dashboard.json; do
            test -f "${site}/${file}"
          done
          node --input-type=module - "${result}" <<'NODE'
          import { readFileSync } from "node:fs";

          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (result.operation !== "site.build" || result.status !== "passed") {
            throw new Error(`unexpected site build result: ${JSON.stringify(result)}`);
          }
          for (const field of ["routes", "pages", "assets", "bytes"]) {
            if (!(result.counts?.[field] > 0)) throw new Error(`site build count ${field} was not positive`);
          }
          if (result.counts.warnings !== 0) throw new Error(`site build emitted warnings: ${result.counts.warnings}`);
          console.log(JSON.stringify(result.counts));
          NODE
          if find "${site}/assets" -type f \( -name '*.js' -o -name '*.mjs' \) -exec grep -F -l '/rpc' {} + | grep -q .; then
            echo "static runtime assets must not contain an RPC endpoint" >&2
            exit 1
          fi
          if grep -R -F -l "${GITHUB_WORKSPACE}" "${site}"; then
            echo "static artifact contains an absolute workspace path" >&2
            exit 1
          fi
          if grep -R -F -l 'window.__FORMA_STATIC_WORKSPACE__' "${site}"; then
            echo "static artifact must not contain an executable inline workspace configuration" >&2
            exit 1
          fi
          node --input-type=module - "${site}" <<'NODE'
          import { readFileSync, readdirSync, statSync } from "node:fs";
          import { join } from "node:path";

          const root = process.argv[2];
          const stack = [root];
          while (stack.length > 0) {
            const directory = stack.pop();
            for (const name of readdirSync(directory)) {
              const path = join(directory, name);
              if (statSync(path).isDirectory()) {
                stack.push(path);
                continue;
              }
              if (!path.endsWith(".html")) continue;
              const html = readFileSync(path, "utf8");
              for (const match of html.matchAll(/<script\b([^>]*)>/giu)) {
                const attributes = match[1];
                if (/\btype\s*=\s*["']application\/json["']/iu.test(attributes)) continue;
                if (!/\bsrc\s*=/iu.test(attributes)) {
                  throw new Error(`static artifact contains an executable inline script: ${path}`);
                }
              }
            }
          }
          NODE
          grep -F "Content-Security-Policy: default-src 'self'" "${site}/_headers"
          grep -F "script-src 'self'" "${site}/_headers"
          digest() {
            (cd "${site}" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          }
          first_digest="$(digest)"
          "${GITHUB_WORKSPACE}/target/debug/forma" site build \
            --out dist/site \
            --base-url https://forma.choral.io \
            --json > "${RUNNER_TEMP}/site-build-repeat.json"
          test "${first_digest}" = "$(digest)"
          echo "treeDigest=${first_digest}" >> "${GITHUB_STEP_SUMMARY}"
          echo "artifactFiles=$(find "${site}" -type f | wc -l | tr -d ' ')" >> "${GITHUB_STEP_SUMMARY}"
          printf '%s\n' "${GITHUB_SHA}" > "${site}/.forma-source-sha"

      - name: Upload static site artifact
        uses: actions/upload-artifact@v7
        with:
          name: forma-static-site
          path: dist/site
          if-no-files-found: error
          include-hidden-files: true

  knowledge:
    name: Knowledge
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check knowledge Markdown
        run: pnpm exec prettier --check "knowledge/**/*.md"

  windows-installer:
    name: Windows installer
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Windows installer
        shell: pwsh
        run: ./scripts/install-windows.test.ps1

  unix-installer:
    name: Unix installer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Unix installer
        shell: bash
        run: sh ./scripts/install-unix.test.sh

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check GitHub Actions syntax
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          # actionlint 1.7.12 predates GitHub's concurrency.queue field. The
          # structured workflow contract fixes that field to the supported
          # `queue: max` value until actionlint recognizes it.
          "${RUNNER_TEMP}/actionlint" -color -ignore 'unexpected key "queue"'

      - name: Check web packages
        run: pnpm check

      - name: Lint web packages
        run: pnpm lint

      - name: Run web and workflow tests
        run: pnpm test

      - name: Build web packages
        run: pnpm build

      - name: Run Mermaid Worker upgrade gate
        run: pnpm --filter @choral-forma/webapp test:mermaid-worker-upgrade

  extension:
    name: VS Code Extension
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check aligned release versions
        run: node scripts/check-release-version.mjs

      - name: Check, lint, test, and build extension
        run: |
          pnpm --filter @choral-forma/shared build
          pnpm --filter forma check
          pnpm --filter forma lint
          pnpm --filter forma test
          pnpm --filter forma build

      - name: Build development Forma binary
        run: |
          pnpm --filter @choral-forma/webapp build
          cargo build --locked --bin forma

      - name: Run Extension Host tests
        env:
          FORMA_TEST_BIN: ${{ github.workspace }}/target/debug/forma
        run: PATH="${{ github.workspace }}/target/debug:$PATH" xvfb-run -a pnpm --filter forma test:integration

      - name: Inspect package contents
        run: pnpm --filter forma package:contents

      - name: Resolve VSIX output
        shell: bash
        run: |
          version="$(node -p "require('./extensions/vscode/package.json').version")"
          echo "VSIX_OUT=${RUNNER_TEMP}/forma-${version}.vsix" >> "$GITHUB_ENV"

      - name: Package VSIX
        run: pnpm --filter forma package:vsix

      - name: Smoke test packaged VSIX
        env:
          FORMA_TEST_BIN: ${{ github.workspace }}/target/debug/forma
          VSIX_PATH: ${{ env.VSIX_OUT }}
        run: xvfb-run -a pnpm --filter forma smoke:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: forma-vscode
          path: ${{ env.VSIX_OUT }}
          if-no-files-found: error

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build embedded WebApp assets
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Check Zed extension WebAssembly
        run: cargo check -p forma-zed-extension --target wasm32-wasip1 --locked

      - name: Test Rust workspace
        run: cargo test --workspace --locked

  cli-release-build:
    name: CLI release build verification
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-cli-build.yml
    with:
      source_sha: ${{ github.sha }}

  deploy-site:
    name: Deploy forma.choral.io
    needs: [site, knowledge, windows-installer, unix-installer, web, extension, rust, cli-release-build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.site.result == 'success' && needs.knowledge.result == 'success' && needs.windows-installer.result == 'success' && needs.unix-installer.result == 'success' && needs.web.result == 'success' && needs.extension.result == 'success' && needs.rust.result == 'success' && needs.cli-release-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: forma.choral.io
      url: https://forma.choral.io
    steps:
      - name: Reject a superseded main artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "superseded=true" >> "${GITHUB_OUTPUT}"
            echo "Deployment skipped: ${GITHUB_SHA} was superseded by ${current_main}." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout exact source
        if: steps.source.outputs.superseded != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        if: steps.source.outputs.superseded != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.source.outputs.superseded != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install deployment dependencies
        if: steps.source.outputs.superseded != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download verified static artifact
        if: steps.source.outputs.superseded != 'true'
        uses: actions/download-artifact@v8
        with:
          name: forma-static-site
          path: dist/site

      - name: Verify source-bound static artifact
        if: steps.source.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html 404.html sitemap.xml robots.txt _headers .forma-site-artifact .forma-source-sha data/dashboard.json; do
            test -f "dist/site/${file}"
          done
          test "$(tr -d '\r\n' < dist/site/.forma-source-sha)" = "${GITHUB_SHA}"
          echo "sourceCommit=${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "artifactFiles=$(find dist/site -type f | wc -l | tr -d ' ')" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy static assets to Cloudflare
        if: steps.source.outputs.superseded != 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${current_main}" = "${GITHUB_SHA}"
          pnpm site:deploy
