name: Deploy static site

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-branch CI run ID that produced forma-static-site
        required: true
        type: string
      source_sha:
        description: Full source commit SHA associated with that CI run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-static-site-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy forma.choral.io
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: forma.choral.io
      url: https://forma.choral.io
    steps:
      - name: Validate CI run
        shell: bash
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${CI_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          test "$(jq -r '.name' <<< "${run_json}")" = "CI"
          test "$(jq -r '.head_branch' <<< "${run_json}")" = "main"
          test "$(jq -r '.head_sha' <<< "${run_json}")" = "${SOURCE_SHA}"
          test "$(jq -r '.conclusion' <<< "${run_json}")" = "success"

      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified static artifact
        shell: bash
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${CI_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name forma-static-site \
            --dir dist/site

      - name: Verify downloaded artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          for file in index.html 404.html sitemap.xml robots.txt .forma-site-artifact data/dashboard.json; do
            test -f "dist/site/${file}"
          done
          echo "sourceCommit=${SOURCE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "artifactFiles=$(find dist/site -type f | wc -l | tr -d ' ')" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy static assets to Cloudflare
        run: pnpm site:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
