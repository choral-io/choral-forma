[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm", "rust"]

[tasks."check:pnpm"]
description = "Check non-Rust files with pnpm-managed tools"
run = "pnpm check && pnpm lint"

[tasks."format:pnpm"]
description = "Format non-Rust files with pnpm-managed tools"
run = "pnpm format"

[tasks."test:pnpm"]
description = "Test pnpm workspace"
run = "pnpm test"

[tasks."check:rust"]
description = "Check Rust workspace"
depends = ["build:pnpm"]
run = "cargo fmt --all -- --check && cargo check --workspace"

[tasks."check:zed"]
description = "Check the Zed extension WebAssembly target"
run = "cargo check -p forma-zed-extension --target wasm32-wasip1"

[tasks."format:rust"]
description = "Format Rust workspace"
run = "cargo fmt --all"

[tasks."test:rust"]
description = "Test Rust workspace"
depends = ["build:pnpm"]
run = "cargo test --workspace"

[tasks."build:pnpm"]
description = "Build pnpm workspace"
run = "pnpm build"

[tasks."perf:build"]
description = "Build the optimized Forma CLI used by performance benchmarks"
run = "cargo build --release --locked --bin forma"

[tasks."perf:quick"]
description = "Run the quick Forma performance suite"
depends = ["perf:build"]
run = "node scripts/performance-benchmark.mjs --mode quick"

[tasks."perf:baseline"]
description = "Run the full Forma performance baseline suite"
depends = ["perf:build"]
run = "node scripts/performance-benchmark.mjs --mode baseline"

[tasks."perf:lsp:quick"]
description = "Run the quick persistent Forma LSP performance suite"
depends = ["perf:build"]
run = "node scripts/lsp-performance-benchmark.mjs --mode quick"

[tasks."perf:lsp:baseline"]
description = "Run the persistent Forma LSP performance baseline suite"
depends = ["perf:build"]
run = "node scripts/lsp-performance-benchmark.mjs --mode baseline"

[tasks."version:set"]
description = "Set the aligned Forma release version"
run = "node scripts/set-release-version.mjs"

[tasks."version:check"]
description = "Check aligned Forma release versions"
run = "node scripts/check-release-version.mjs"

[tasks."release:verify"]
description = "Verify a published Forma release and managed CLI installation"
run = "node scripts/verify-release.mjs"

[tasks.check]
description = "Run all project checks"
depends = ["check:pnpm", "test:pnpm", "check:rust", "check:zed", "test:rust"]
