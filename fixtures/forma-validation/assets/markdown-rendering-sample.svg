<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">Forma validation pipeline</title>
  <desc id="description">Three connected stages labeled Markdown source, Forma projection, and Browser review.</desc>
  <rect width="960" height="320" rx="32" fill="#0f172a"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="70" y="92" width="220" height="136" rx="22" fill="#1d4ed8"/>
    <text x="180" y="148" fill="#ffffff" font-size="22" font-weight="700">Markdown source</text>
    <text x="180" y="184" fill="#dbeafe" font-size="16">Committed fixture files</text>
    <rect x="370" y="92" width="220" height="136" rx="22" fill="#7c3aed"/>
    <text x="480" y="148" fill="#ffffff" font-size="22" font-weight="700">Forma projection</text>
    <text x="480" y="184" fill="#ede9fe" font-size="16">CLI and read model</text>
    <rect x="670" y="92" width="220" height="136" rx="22" fill="#059669"/>
    <text x="780" y="148" fill="#ffffff" font-size="22" font-weight="700">Browser review</text>
    <text x="780" y="184" fill="#d1fae5" font-size="16">Visible acceptance</text>
    <path d="M290 160h64" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <path d="m342 143 20 17-20 17" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M590 160h64" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <path d="m642 143 20 17-20 17" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
